name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: cd example && flutter pub get && flutter test
      - run: cd example && dart run iphone_duo_adapt:duo_audit --fail-on=warning
      - name: duo_migrate is idempotent on the example
        run: cd example && dart run iphone_duo_adapt:duo_migrate --json | grep '"files": \[\]'
