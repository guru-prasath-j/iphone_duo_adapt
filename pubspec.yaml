name: iphone_duo_adapt
description: Make an existing Flutter app iPhone Duo ready. Native hinge and fold bridge, rail and split retrofits, fold-safe layouts, preview, test kit, audit and auto-migration.
version: 0.3.0
homepage: https://github.com/guru-prasath-j/iphone_duo_adapt
repository: https://github.com/guru-prasath-j/iphone_duo_adapt
issue_tracker: https://github.com/guru-prasath-j/iphone_duo_adapt/issues
topics:
  - foldable
  - iphone-duo
  - adaptive
  - responsive
  - layout

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Only used by package:iphone_duo_adapt/testing.dart, which apps import
  # from their tests.
  flutter_test:
    sdk: flutter
  yaml: ^3.1.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IphoneDuoAdaptPlugin

executables:
  duo_audit:
  duo_migrate:
